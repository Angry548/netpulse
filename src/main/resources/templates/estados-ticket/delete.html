<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <h1>Eliminar estado de ticket</h1>

    <h3>
        ¿Está seguro que desea eliminar este registro?
    </h3>

    <hr>

    <dl class="row">

        <dt class="col-sm-2">
            ID
        </dt>

        <dd class="col-sm-10"
            th:text="${estadoTicket.id}">
        </dd>


        <dt class="col-sm-2">
            Nombre
        </dt>

        <dd class="col-sm-10"
            th:text="${estadoTicket.nombre}">
        </dd>


        <dt class="col-sm-2">
            Descripción
        </dt>

        <dd class="col-sm-10"
            th:text="${estadoTicket.descripcion}">
        </dd>

    </dl>

    <form th:action="@{/estados-ticket/delete}"
          method="post">

        <input type="hidden"
               name="id"
               th:value="${estadoTicket.id}">

        <input type="submit"
               value="Eliminar"
               class="btn btn-danger">

        <a th:href="@{/estados-ticket}"
           class="btn btn-secondary">
            Regresar
        </a>

    </form>

</div>

</html>
