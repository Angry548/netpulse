<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <div th:if="${msg != null}">
        <script th:inline="javascript">
            Swal.fire({
                title: "Confirmación",
                text: /*[[${msg}]]*/ "",
                icon: "success"
            });
        </script>
    </div>


    <div th:if="${error != null}">
        <script th:inline="javascript">
            Swal.fire({
                title: "Error",
                text: /*[[${error}]]*/ "",
                icon: "error"
            });
        </script>
    </div>


    <h1 class="mt-4">Listado de usuarios</h1>


    <div class="mb-3">

        <a th:href="@{/usuarios/create}"
           class="btn btn-outline-primary">

            <i class="fas fa-plus"></i>
            Nuevo usuario

        </a>

    </div>

    <form th:action="@{/usuarios}"
          method="get"
          class="row g-2 my-3">

        <div class="col-md-2">

            <label for="id"
                   class="visually-hidden">
                ID
            </label>

            <input type="number"
                   class="form-control"
                   id="id"
                   name="id"
                   th:value="${id}"
                   placeholder="Buscar por ID">

        </div>

        <div class="col-md-4">

            <label for="nombre"
                   class="visually-hidden">
                Nombre
            </label>

            <input type="text"
                   class="form-control"
                   id="nombre"
                   name="nombre"
                   th:value="${nombre}"
                   placeholder="Buscar por nombre">

        </div>

        <div class="col-md-4">

            <label for="correo"
                   class="visually-hidden">
                Correo
            </label>

            <input type="text"
                   class="form-control"
                   id="correo"
                   name="correo"
                   th:value="${correo}"
                   placeholder="Buscar por correo">

        </div>

        <div class="col-auto">

            <button type="submit"
                    class="btn btn-outline-secondary">

                <i class="fas fa-search"></i>
                Buscar

            </button>

        </div>

        <div class="col-auto">

            <a th:href="@{/usuarios}"
               class="btn btn-outline-secondary">

                <i class="fas fa-broom"></i>
                Limpiar

            </a>

        </div>

    </form>

    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Nombre</th>

                <th>Correo</th>

                <th>Rol</th>

                <th>Estado</th>

                <th>Fecha de creación</th>

                <th>Último acceso</th>

                <th>Acciones</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="item : ${usuarios}">

                <td th:text="${item.id}">
                    1
                </td>

                <td th:text="${item.nombre}">
                    Juan Pérez
                </td>

                <td th:text="${item.correo}">
                    usuario@correo.com
                </td>

                <td th:text="${item.rol != null ? item.rol.nombre : 'Sin rol'}">
                    Administrador
                </td>

                <td>

                    <span th:if="${item.activo}"
                          class="badge bg-success">

                        Activo

                    </span>

                    <span th:unless="${item.activo}"
                          class="badge bg-danger">

                        Inactivo

                    </span>

                </td>

                <td th:text="${item.fechaCreacion != null ? #temporals.format(item.fechaCreacion, 'dd/MM/yyyy HH:mm') : 'No registrada'}">

                    01/09/2026 10:30

                </td>

                <td th:text="${item.ultimoAcceso != null ? #temporals.format(item.ultimoAcceso, 'dd/MM/yyyy HH:mm') : 'Nunca'}">

                    01/09/2026 12:00

                </td>

                <td>
                    <a th:href="@{/usuarios/details/{id}(id=${item.id})}"
                       class="btn btn-outline-secondary btn-sm">

                        <i class="fas fa-eye"></i>
                        Detalles

                    </a>

                    <a th:href="@{/usuarios/edit/{id}(id=${item.id})}"
                       class="btn btn-outline-info btn-sm">

                        <i class="fas fa-edit"></i>
                        Editar

                    </a>

                    <a th:href="@{/usuarios/remove/{id}(id=${item.id})}"
                       class="btn btn-outline-danger btn-sm">

                        <i class="fas fa-trash"></i>
                        Eliminar

                    </a>

                </td>

            </tr>

            <tr th:if="${usuarios.empty}">

                <td colspan="8"
                    class="text-center text-muted">

                    No se encontraron usuarios.

                </td>

            </tr>

            </tbody>

        </table>

    </div>
    <nav th:if="${usuarios.totalPages > 1}"
         aria-label="Paginación de usuarios">

        <ul class="pagination">
            <li class="page-item"
                th:classappend="${usuarios.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/usuarios(
                       page=${usuarios.number},
                       size=${usuarios.size},
                       id=${id},
                       nombre=${nombre},
                       correo=${correo}
                   )}">

                    Anterior

                </a>

            </li>

            <li class="page-item"
                th:each="pageNumber : ${pageNumbers}"
                th:classappend="${pageNumber == usuarios.number + 1} ? 'active'">

                <a class="page-link"
                   th:href="@{/usuarios(
                       page=${pageNumber},
                       size=${usuarios.size},
                       id=${id},
                       nombre=${nombre},
                       correo=${correo}
                   )}"
                   th:text="${pageNumber}">

                    1

                </a>

            </li>

            <li class="page-item"
                th:classappend="${usuarios.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/usuarios(
                       page=${usuarios.number + 2},
                       size=${usuarios.size},
                       id=${id},
                       nombre=${nombre},
                       correo=${correo}
                   )}">

                    Siguiente

                </a>

            </li>

        </ul>

    </nav>

</div>

</html>
