<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Detalles del Ticket</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="mb-1">

                    <i class="fa-solid fa-ticket"></i>
                    Detalles del Ticket

                </h2>

                <p class="text-muted mb-0">
                    Información del ticket seleccionado.
                </p>

            </div>

        </div>

        <div th:if="${msg != null}">
            <script th:inline="javascript">
                Swal.fire({
                    title: "Confirmación",
                    text: /*[[${msg}]]*/ "",
                    icon: "success"
                });
            </script>
        </div>

        <div th:if="${error != null}">
            <script th:inline="javascript">
                Swal.fire({
                    title: "Error",
                    text: /*[[${error}]]*/ "",
                    icon: "error"
                });
            </script>
        </div>

        <div class="card shadow-sm">

            <div class="card-header">

                <h5 class="mb-0">
                    Información general
                </h5>

            </div>

            <div class="card-body">

                <div class="row">

                    <!-- ID -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            ID
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.idTicket}"
                               readonly>

                    </div>

                    <!-- FECHA CREACIÓN -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Fecha de creación
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.fechaCreacion != null ? #temporals.format(ticket.fechaCreacion, 'dd/MM/yyyy HH:mm') : 'No registrada'}"
                               readonly>

                    </div>

                    <!-- DESCRIPCIÓN -->

                    <div class="col-md-12 mb-3">

                        <label class="form-label fw-bold">
                            Descripción
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  readonly
                                  th:text="${ticket.descripcion}">
                        </textarea>

                    </div>

                    <!-- USUARIO REPORTA -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Usuario que reporta
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.usuarioReporta != null ? ticket.usuarioReporta.nombre : 'Sin usuario'}"
                               readonly>

                    </div>

                    <!-- TÉCNICO -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Técnico
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.tecnico != null ? ticket.tecnico.nombre : 'Sin asignar'}"
                               readonly>

                    </div>

                    <!-- EQUIPO -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Equipo
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.equipo != null ? ticket.equipo.nombre : 'Sin equipo'}"
                               readonly>

                    </div>

                    <!-- CATEGORÍA -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Categoría
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.categoria != null ? ticket.categoria.nombre : 'Sin categoría'}"
                               readonly>

                    </div>

                    <!-- PRIORIDAD -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Prioridad
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.prioridad != null ? ticket.prioridad.nombre : 'Sin prioridad'}"
                               readonly>

                    </div>

                    <!-- ESTADO -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Estado
                        </label>

                        <div>

                            <span th:if="${ticket.estadoTicket != null}"
                                  class="badge bg-primary"
                                  th:text="${ticket.estadoTicket.nombre}">
                                Abierto
                            </span>

                            <span th:unless="${ticket.estadoTicket != null}"
                                  class="badge bg-secondary">
                                Sin estado
                            </span>

                        </div>

                    </div>

                    <!-- FECHA ASIGNACIÓN -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Fecha de asignación
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.fechaAsignacion != null ? #temporals.format(ticket.fechaAsignacion, 'dd/MM/yyyy HH:mm') : 'No asignado'}"
                               readonly>

                    </div>

                    <!-- FECHA RESOLUCIÓN -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Fecha de resolución
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.fechaResolucion != null ? #temporals.format(ticket.fechaResolucion, 'dd/MM/yyyy HH:mm') : 'No resuelto'}"
                               readonly>

                    </div>

                </div>

                <hr>

                <!-- ==================================================
                     ASIGNAR TÉCNICO
                     ================================================== -->

                <h5 class="mb-3">
                    <i class="fa-solid fa-user-gear"></i>
                    Asignar técnico
                </h5>

                <form th:action="@{/tickets/asignar-tecnico}"
                      method="post"
                      class="row g-2 mb-4">

                    <input type="hidden"
                           name="idTicket"
                           th:value="${ticket.idTicket}">

                    <div class="col-md-8">

                        <select name="idTecnico"
                                class="form-select"
                                required>

                            <option value="">
                                Seleccione un técnico
                            </option>

                            <option th:each="tecnico : ${tecnicos}"
                                    th:value="${tecnico.id}"
                                    th:text="${tecnico.nombre}"
                                    th:selected="${ticket.tecnico != null and ticket.tecnico.id == tecnico.id}">
                            </option>

                        </select>

                    </div>

                    <div class="col-md-4">

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="fa-solid fa-user-check"></i>
                            Asignar técnico

                        </button>

                    </div>

                </form>

                <!-- ==================================================
                     CAMBIAR ESTADO
                     ================================================== -->

                <h5 class="mb-3">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    Cambiar estado
                </h5>

                <form th:action="@{/tickets/cambiar-estado}"
                      method="post"
                      class="row g-2 mb-4">

                    <input type="hidden"
                           name="idTicket"
                           th:value="${ticket.idTicket}">

                    <div class="col-md-8">

                        <select name="idEstadoTicket"
                                class="form-select"
                                required>

                            <option value="">
                                Seleccione un estado
                            </option>

                            <option th:each="estado : ${estados}"
                                    th:value="${estado.id}"
                                    th:text="${estado.nombre}"
                                    th:selected="${ticket.estadoTicket != null and ticket.estadoTicket.id == estado.id}">
                            </option>

                        </select>

                    </div>

                    <div class="col-md-4">

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="fa-solid fa-check"></i>
                            Cambiar estado

                        </button>

                    </div>

                </form>

                <!-- ==================================================
                     CAMBIAR PRIORIDAD
                     ================================================== -->

                <h5 class="mb-3">
                    <i class="fa-solid fa-flag"></i>
                    Cambiar prioridad
                </h5>

                <form th:action="@{/tickets/cambiar-prioridad}"
                      method="post"
                      class="row g-2 mb-4">

                    <input type="hidden"
                           name="idTicket"
                           th:value="${ticket.idTicket}">

                    <div class="col-md-8">

                        <select name="idPrioridad"
                                class="form-select"
                                required>

                            <option value="">
                                Seleccione una prioridad
                            </option>

                            <option th:each="prioridad : ${prioridades}"
                                    th:value="${prioridad.id}"
                                    th:text="${prioridad.nombre}"
                                    th:selected="${ticket.prioridad != null and ticket.prioridad.id == prioridad.id}">
                            </option>

                        </select>

                    </div>

                    <div class="col-md-4">

                        <button type="submit"
                                class="btn btn-warning">

                            <i class="fa-solid fa-flag"></i>
                            Cambiar prioridad

                        </button>

                    </div>

                </form>

                <!-- ==================================================
                     RESOLVER
                     ================================================== -->

                <h5 class="mb-3">
                    <i class="fa-solid fa-circle-check"></i>
                    Resolver ticket
                </h5>

                <form th:action="@{/tickets/resolver}"
                      method="post"
                      class="mb-4">

                    <input type="hidden"
                           name="idTicket"
                           th:value="${ticket.idTicket}">

                    <button type="submit"
                            class="btn btn-success">

                        <i class="fa-solid fa-check-double"></i>
                        Marcar como resuelto

                    </button>

                </form>

                <hr>

                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/tickets/edit/{id}(id=${ticket.idTicket})}"
                       class="btn btn-warning">

                        <i class="fa-solid fa-pen"></i>
                        Editar

                    </a>

                    <a th:href="@{/tickets}"
                       class="btn btn-secondary">

                        Regresar

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
