<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Eliminar Ticket</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="mb-1 text-danger">

                    <i class="fa-solid fa-ticket-slash"></i>
                    Eliminar Ticket

                </h2>

                <p class="text-muted mb-0">
                    Confirma la eliminación del ticket.
                </p>

            </div>

        </div>

        <div class="card shadow-sm border-danger">

            <div class="card-header bg-danger text-white">

                <h5 class="mb-0">
                    Confirmación
                </h5>

            </div>

            <div class="card-body">

                <div class="alert alert-warning">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <strong>¡Atención!</strong>

                    ¿Está seguro de que desea eliminar este ticket?

                    Esta acción no se puede deshacer.

                </div>

                <div class="row">

                    <!-- ID -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            ID
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.idTicket}"
                               readonly>

                    </div>

                    <!-- FECHA -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Fecha de creación
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.fechaCreacion != null ? #temporals.format(ticket.fechaCreacion, 'dd/MM/yyyy HH:mm') : 'No registrada'}"
                               readonly>

                    </div>

                    <!-- DESCRIPCIÓN -->

                    <div class="col-md-12 mb-3">

                        <label class="form-label fw-bold">
                            Descripción
                        </label>

                        <textarea class="form-control"
                                  rows="3"
                                  readonly
                                  th:text="${ticket.descripcion}">
                        </textarea>

                    </div>

                    <!-- USUARIO -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Usuario que reporta
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.usuarioReporta != null ? ticket.usuarioReporta.nombre : 'Sin usuario'}"
                               readonly>

                    </div>

                    <!-- EQUIPO -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Equipo
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.equipo != null ? ticket.equipo.nombre : 'Sin equipo'}"
                               readonly>

                    </div>

                    <!-- CATEGORÍA -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Categoría
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.categoria != null ? ticket.categoria.nombre : 'Sin categoría'}"
                               readonly>

                    </div>

                    <!-- PRIORIDAD -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Prioridad
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.prioridad != null ? ticket.prioridad.nombre : 'Sin prioridad'}"
                               readonly>

                    </div>

                    <!-- ESTADO -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Estado
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.estadoTicket != null ? ticket.estadoTicket.nombre : 'Sin estado'}"
                               readonly>

                    </div>

                </div>

                <hr>

                <form th:action="@{/tickets/delete}"
                      method="post">

                    <input type="hidden"
                           name="idTicket"
                           th:value="${ticket.idTicket}">

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/tickets}"
                           class="btn btn-secondary">

                            Cancelar

                        </a>

                        <button type="submit"
                                class="btn btn-danger">

                            <i class="fa-solid fa-trash"></i>

                            Sí, eliminar ticket

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
