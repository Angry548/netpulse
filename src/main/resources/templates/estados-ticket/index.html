<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Estados de Ticket</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <div th:if="${msg != null}">
            <script th:inline="javascript">
                Swal.fire({
                    title: "Confirmación",
                    text: /*[[${msg}]]*/ "",
                    icon: "success"
                });
            </script>
        </div>

        <div th:if="${error != null}">
            <script th:inline="javascript">
                Swal.fire({
                    title: "Error",
                    text: /*[[${error}]]*/ "",
                    icon: "error"
                });
            </script>
        </div>

        <h1 class="mt-4">
            Listado de estados de ticket
        </h1>

        <div class="mb-3">

            <a th:href="@{/estados-ticket/create}"
               class="btn btn-outline-primary">

                <i class="fas fa-plus"></i>
                Nuevo estado

            </a>

        </div>

        <form th:action="@{/estados-ticket}"
              method="get"
              class="row g-2 my-3">

            <div class="col-md-2">

                <label for="id"
                       class="visually-hidden">
                    ID
                </label>

                <input type="number"
                       class="form-control"
                       id="id"
                       name="id"
                       th:value="${id}"
                       placeholder="Buscar por ID">

            </div>

            <div class="col-md-5">

                <label for="nombre"
                       class="visually-hidden">
                    Nombre
                </label>

                <input type="text"
                       class="form-control"
                       id="nombre"
                       name="nombre"
                       th:value="${nombre}"
                       placeholder="Buscar por nombre">

            </div>

            <div class="col-auto">

                <button type="submit"
                        class="btn btn-outline-secondary">

                    <i class="fas fa-search"></i>
                    Buscar

                </button>

            </div>

            <div class="col-auto">

                <a th:href="@{/estados-ticket}"
                   class="btn btn-outline-secondary">

                    <i class="fas fa-broom"></i>
                    Limpiar

                </a>

            </div>

        </form>

        <div class="table-responsive">

            <table class="table table-striped table-hover">

                <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Acciones</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="item : ${estados}">

                    <td th:text="${item.id}">
                        1
                    </td>

                    <td th:text="${item.nombre}">
                        Abierto
                    </td>

                    <td th:text="${item.descripcion != null ? item.descripcion : 'Sin descripción'}">
                        Estado inicial del ticket
                    </td>

                    <td>

                        <a th:href="@{/estados-ticket/details/{id}(id=${item.id})}"
                           class="btn btn-outline-secondary btn-sm">

                            <i class="fas fa-eye"></i>
                            Detalles

                        </a>

                        <a th:href="@{/estados-ticket/edit/{id}(id=${item.id})}"
                           class="btn btn-outline-info btn-sm">

                            <i class="fas fa-edit"></i>
                            Editar

                        </a>

                        <a th:href="@{/estados-ticket/remove/{id}(id=${item.id})}"
                           class="btn btn-outline-danger btn-sm">

                            <i class="fas fa-trash"></i>
                            Eliminar

                        </a>

                    </td>

                </tr>

                <tr th:if="${estados.empty}">

                    <td colspan="4"
                        class="text-center text-muted">

                        No se encontraron estados de ticket.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <nav th:if="${estados.totalPages > 1}"
             aria-label="Paginación de estados de ticket">

            <ul class="pagination">

                <li class="page-item"
                    th:classappend="${estados.first} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/estados-ticket(
                           page=${estados.number},
                           size=${estados.size},
                           id=${id},
                           nombre=${nombre}
                       )}">

                        Anterior

                    </a>

                </li>

                <li class="page-item"
                    th:each="pageNumber : ${pageNumbers}"
                    th:classappend="${pageNumber == estados.number + 1} ? 'active'">

                    <a class="page-link"
                       th:href="@{/estados-ticket(
                           page=${pageNumber},
                           size=${estados.size},
                           id=${id},
                           nombre=${nombre}
                       )}"
                       th:text="${pageNumber}">

                        1

                    </a>

                </li>

                <li class="page-item"
                    th:classappend="${estados.last} ? 'disabled'">

                    <a class="page-link"
                       th:href="@{/estados-ticket(
                           page=${estados.number + 2},
                           size=${estados.size},
                           id=${id},
                           nombre=${nombre}
                       )}">

                        Siguiente

                    </a>

                </li>

            </ul>

        </nav>

    </div>

</div>

</body>
</html>
