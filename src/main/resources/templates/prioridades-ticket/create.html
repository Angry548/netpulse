<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <h1>Crear nueva prioridad de ticket</h1>

    <hr>

    <form th:action="@{/prioridades-ticket/save}"
          th:object="${prioridadTicket}"
          method="post">

        <div class="form-group mb-3">

            <label for="nombre">
                Nombre
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{nombre}"
                   id="nombre"
                   maxlength="20"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('nombre')}"
                 th:errors="*{nombre}">
            </div>

        </div>

        <button type="submit"
                class="btn btn-primary">
            Guardar
        </button>

        <a th:href="@{/prioridades-ticket}"
           class="btn btn-secondary">
            Regresar
        </a>

    </form>

</div>

</html>
