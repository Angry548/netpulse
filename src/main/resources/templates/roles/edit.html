<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="/layouts/_mainLayout">

<head> <title>Editar Rol</title> </head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <!-- ENCABEZADO -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="mb-1">
                    <i class="fa-solid fa-user-pen"></i>
                    Editar Rol
                </h2>

                <p class="text-muted mb-0">
                    Modifica la información del rol.
                </p>
            </div>

        </div>


        <!-- TARJETA -->
        <div class="card shadow-sm">

            <div class="card-header">

                <h5 class="mb-0">
                    Información del rol
                </h5>

            </div>


            <div class="card-body">

                <form th:action="@{/roles/save}"
                      th:object="${rol}"
                      method="post">

                    <!-- ID OCULTO -->
                    <input type="hidden"
                           th:field="*{idRol}">


                    <div class="row">

                        <!-- NOMBRE -->
                        <div class="col-md-6 mb-3">

                            <label for="nombre"
                                   class="form-label">

                                Nombre

                            </label>

                            <input type="text"
                                   id="nombre"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   maxlength="50"
                                   required>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}">

                            </div>

                        </div>


                        <!-- DESCRIPCIÓN -->
                        <div class="col-md-6 mb-3">

                            <label for="descripcion"
                                   class="form-label">

                                Descripción

                            </label>

                            <textarea id="descripcion"
                                      th:field="*{descripcion}"
                                      class="form-control"
                                      maxlength="255"
                                      rows="4"></textarea>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('descripcion')}"
                                 th:errors="*{descripcion}">

                            </div>

                        </div>

                    </div>


                    <hr>


                    <!-- BOTONES -->
                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/roles}"
                           class="btn btn-secondary">

                            Cancelar

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="fa-solid fa-save"></i>
                            Guardar Cambios

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body> </html>
