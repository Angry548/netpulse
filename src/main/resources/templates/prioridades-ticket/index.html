<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <div th:if="${msg != null}">
        <script th:inline="javascript">
            Swal.fire({
                title: "Confirmación",
                text: /*[[${msg}]]*/ "",
                icon: "success"
            });
        </script>
    </div>

    <div th:if="${error != null}">
        <script th:inline="javascript">
            Swal.fire({
                title: "Error",
                text: /*[[${error}]]*/ "",
                icon: "error"
            });
        </script>
    </div>

    <h1 class="mt-4">Listado de prioridades de ticket</h1>

    <div class="mb-3">

        <a th:href="@{/prioridades-ticket/create}"
           class="btn btn-outline-primary">

            <i class="fas fa-plus"></i>
            Nueva prioridad

        </a>

    </div>

    <form th:action="@{/prioridades-ticket}"
          method="get"
          class="row g-2 my-3">

        <div class="col-md-2">

            <label for="id"
                   class="visually-hidden">
                ID
            </label>

            <input type="number"
                   class="form-control"
                   id="id"
                   name="id"
                   th:value="${id}"
                   placeholder="Buscar por ID">

        </div>

        <div class="col-md-4">

            <label for="nombre"
                   class="visually-hidden">
                Nombre
            </label>

            <input type="text"
                   class="form-control"
                   id="nombre"
                   name="nombre"
                   th:value="${nombre}"
                   placeholder="Buscar por nombre">

        </div>

        <div class="col-auto">

            <button type="submit"
                    class="btn btn-outline-secondary">

                <i class="fas fa-search"></i>
                Buscar

            </button>

        </div>

        <div class="col-auto">

            <a th:href="@{/prioridades-ticket}"
               class="btn btn-outline-secondary">

                <i class="fas fa-broom"></i>
                Limpiar

            </a>

        </div>

    </form>

    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Nombre</th>

                <th>Acciones</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="item : ${prioridades}">

                <td th:text="${item.id}">
                    1
                </td>

                <td th:text="${item.nombre}">
                    Alta
                </td>

                <td>

                    <a th:href="@{/prioridades-ticket/details/{id}(id=${item.id})}"
                       class="btn btn-outline-secondary btn-sm">

                        <i class="fas fa-eye"></i>
                        Detalles

                    </a>

                    <a th:href="@{/prioridades-ticket/edit/{id}(id=${item.id})}"
                       class="btn btn-outline-info btn-sm">

                        <i class="fas fa-edit"></i>
                        Editar

                    </a>

                    <a th:href="@{/prioridades-ticket/remove/{id}(id=${item.id})}"
                       class="btn btn-outline-danger btn-sm">

                        <i class="fas fa-trash"></i>
                        Eliminar

                    </a>

                </td>

            </tr>

            <tr th:if="${prioridades.empty}">

                <td colspan="3"
                    class="text-center text-muted">

                    No se encontraron prioridades de ticket.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <nav th:if="${prioridades.totalPages > 1}"
         aria-label="Paginación de prioridades">

        <ul class="pagination">

            <li class="page-item"
                th:classappend="${prioridades.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/prioridades-ticket(
                       page=${prioridades.number},
                       size=${prioridades.size},
                       id=${id},
                       nombre=${nombre}
                   )}">

                    Anterior

                </a>

            </li>

            <li class="page-item"
                th:each="pageNumber : ${pageNumbers}"
                th:classappend="${pageNumber == prioridades.number + 1} ? 'active'">

                <a class="page-link"
                   th:href="@{/prioridades-ticket(
                       page=${pageNumber},
                       size=${prioridades.size},
                       id=${id},
                       nombre=${nombre}
                   )}"
                   th:text="${pageNumber}">

                    1

                </a>

            </li>

            <li class="page-item"
                th:classappend="${prioridades.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/prioridades-ticket(
                       page=${prioridades.number + 2},
                       size=${prioridades.size},
                       id=${id},
                       nombre=${nombre}
                   )}">

                    Siguiente

                </a>

            </li>

        </ul>

    </nav>

</div>

</html>
