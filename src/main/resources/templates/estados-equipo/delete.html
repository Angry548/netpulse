<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Eliminar Estado de Equipo</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="mb-1 text-danger">

                    <i class="fa-solid fa-trash"></i>
                    Eliminar Estado de Equipo

                </h2>

                <p class="text-muted mb-0">

                    Confirma la eliminación del estado de equipo.

                </p>

            </div>

        </div>

        <div class="card shadow-sm border-danger">

            <div class="card-header bg-danger text-white">

                <h5 class="mb-0">

                    Confirmación

                </h5>

            </div>

            <div class="card-body">

                <div class="alert alert-warning">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <strong>¡Atención!</strong>

                    ¿Está seguro de que desea eliminar este estado de equipo?

                    Esta acción no se puede deshacer.

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            ID

                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${estadoEquipo.id}"
                               readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            Nombre

                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${estadoEquipo.nombre}"
                               readonly>

                    </div>

                    <div class="col-md-12 mb-3">

                        <label class="form-label fw-bold">

                            Descripción

                        </label>

                        <textarea class="form-control"
                                  rows="3"
                                  th:text="${estadoEquipo.descripcion != null
                                            && !estadoEquipo.descripcion.isBlank()
                                            ? estadoEquipo.descripcion
                                            : 'Sin descripción'}"
                                  readonly></textarea>

                    </div>

                </div>

                <hr>

                <form th:action="@{/estados-equipo/delete}"
                      method="post">

                    <input type="hidden"
                           name="id"
                           th:value="${estadoEquipo.id}">

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/estados-equipo}"
                           class="btn btn-secondary">

                            Cancelar

                        </a>

                        <button type="submit"
                                class="btn btn-danger">

                            <i class="fa-solid fa-trash"></i>

                            Sí, eliminar estado de equipo

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
