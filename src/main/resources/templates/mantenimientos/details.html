<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Detalles del Mantenimiento</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">


        <!-- ENCABEZADO -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="mb-1">

                    <i class="fa-solid fa-screwdriver-wrench"></i>

                    Detalles del Mantenimiento

                </h2>

                <p class="text-muted mb-0">

                    Información del mantenimiento seleccionado.

                </p>

            </div>

        </div>


        <!-- TARJETA -->
        <div class="card shadow-sm">

            <div class="card-header">

                <h5 class="mb-0">

                    Información general

                </h5>

            </div>


            <div class="card-body">

                <div class="row">


                    <!-- ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            ID

                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.id}"
                               readonly>

                    </div>


                    <!-- EQUIPO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            Equipo

                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.equipo != null ? mantenimiento.equipo.nombre : 'Sin equipo'}"
                               readonly>

                    </div>


                    <!-- TÉCNICO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            Técnico

                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.tecnico != null ? mantenimiento.tecnico.nombre : 'Sin técnico'}"
                               readonly>

                    </div>


                    <!-- TICKET -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            Ticket

                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.ticket != null ? 'Ticket #' + mantenimiento.ticket.idTicket : 'Sin ticket asociado'}"
                               readonly>

                    </div>


                    <!-- TIPO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            Tipo de mantenimiento

                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.tipo != null ? mantenimiento.tipo : 'Sin tipo'}"
                               readonly>

                    </div>


                    <!-- FECHA -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">

                            Fecha

                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.fecha != null
                                          ? #temporals.format(mantenimiento.fecha, 'dd/MM/yyyy HH:mm')
                                          : 'No registrada'}"
                               readonly>

                    </div>


                    <!-- DESCRIPCIÓN -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label fw-bold">

                            Descripción

                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  readonly
                                  th:text="${mantenimiento.descripcion}">

                        </textarea>

                    </div>


                    <!-- REPUESTOS -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label fw-bold">

                            Repuestos utilizados

                        </label>

                        <textarea class="form-control"
                                  rows="3"
                                  readonly
                                  th:text="${mantenimiento.repuestos != null and !mantenimiento.repuestos.isBlank()
                                            ? mantenimiento.repuestos
                                            : 'No se registraron repuestos'}">

                        </textarea>

                    </div>

                </div>


                <hr>


                <!-- BOTONES -->
                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/mantenimientos/edit/{id}(id=${mantenimiento.id})}"
                       class="btn btn-warning">

                        <i class="fa-solid fa-pen"></i>

                        Editar

                    </a>


                    <a th:href="@{/mantenimientos}"
                       class="btn btn-secondary">

                        Regresar

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
