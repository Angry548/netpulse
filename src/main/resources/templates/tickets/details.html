<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Detalles del Ticket</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <!-- ENCABEZADO -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="mb-1">
                    <i class="fa-solid fa-ticket"></i>
                    Detalles del Ticket
                </h2>

                <p class="text-muted mb-0">
                    Información del ticket seleccionado.
                </p>
            </div>

        </div>

        <!-- TARJETA -->
        <div class="card shadow-sm">

            <div class="card-header">
                <h5 class="mb-0">
                    Información general
                </h5>
            </div>

            <div class="card-body">

                <div class="row">

                    <!-- ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            ID
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.idTicket}"
                               readonly>

                    </div>


                    <!-- FECHA DE CREACIÓN -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Fecha de creación
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.fechaCreacion != null ? #temporals.format(ticket.fechaCreacion, 'dd/MM/yyyy HH:mm') : 'No registrada'}"
                               readonly>

                    </div>


                    <!-- DESCRIPCIÓN -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label fw-bold">
                            Descripción
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  readonly
                                  th:text="${ticket.descripcion}">
                        </textarea>

                    </div>


                    <!-- USUARIO QUE REPORTA -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Usuario que reporta
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.usuarioReporta != null ? ticket.usuarioReporta.nombre : 'Sin usuario'}"
                               readonly>

                    </div>


                    <!-- TÉCNICO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Técnico asignado
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.tecnico != null ? ticket.tecnico.nombre : 'Sin asignar'}"
                               readonly>

                    </div>


                    <!-- EQUIPO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Equipo
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.equipo != null ? ticket.equipo.nombre : 'Sin equipo'}"
                               readonly>

                    </div>


                    <!-- CATEGORÍA -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Categoría
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.categoria != null ? ticket.categoria.nombre : 'Sin categoría'}"
                               readonly>

                    </div>


                    <!-- PRIORIDAD -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Prioridad
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.prioridad != null ? ticket.prioridad.nombre : 'Sin prioridad'}"
                               readonly>

                    </div>


                    <!-- ESTADO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Estado
                        </label>

                        <div>

                            <span th:if="${ticket.estadoTicket != null}"
                                  class="badge bg-primary"
                                  th:text="${ticket.estadoTicket.nombre}">
                                Estado
                            </span>

                            <span th:unless="${ticket.estadoTicket != null}"
                                  class="badge bg-secondary">
                                Sin estado
                            </span>

                        </div>

                    </div>


                    <!-- FECHA DE ASIGNACIÓN -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Fecha de asignación
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.fechaAsignacion != null ? #temporals.format(ticket.fechaAsignacion, 'dd/MM/yyyy HH:mm') : 'No asignado'}"
                               readonly>

                    </div>


                    <!-- FECHA DE RESOLUCIÓN -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Fecha de resolución
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${ticket.fechaResolucion != null ? #temporals.format(ticket.fechaResolucion, 'dd/MM/yyyy HH:mm') : 'No resuelto'}"
                               readonly>

                    </div>

                </div>

                <hr>

                <!-- BOTONES -->
                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/tickets/edit/{id}(id=${ticket.idTicket})}"
                       class="btn btn-warning">

                        <i class="fa-solid fa-pen"></i>
                        Editar

                    </a>

                    <a th:href="@{/tickets}"
                       class="btn btn-secondary">

                        Regresar

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
