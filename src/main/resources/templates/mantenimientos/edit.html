<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <h1>Editar mantenimiento</h1>

    <form th:action="@{/mantenimientos/save}"
          th:object="${mantenimiento}"
          method="post">

        <input type="hidden"
               th:field="*{id}">


        <!-- EQUIPO -->

        <div class="form-group mb-3">

            <label for="equipo">Equipo</label>

            <select class="form-control"
                    th:field="*{equipo}"
                    id="equipo"
                    required>

                <option th:each="item : ${equipos}"
                        th:value="${item.id}"
                        th:text="${item.nombre}">
                </option>

            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('equipo')}"
                 th:errors="*{equipo}">
            </div>

        </div>


        <!-- TECNICO -->

        <div class="form-group mb-3">

            <label for="tecnico">
                Técnico responsable
            </label>

            <select class="form-control"
                    th:field="*{tecnico}"
                    id="tecnico"
                    required>

                <option th:each="item : ${usuarios}"
                        th:value="${item.id}"
                        th:text="${item.nombre}">
                </option>

            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('tecnico')}"
                 th:errors="*{tecnico}">
            </div>

        </div>


        <!-- TICKET -->

        <div class="form-group mb-3">

            <label for="ticket">
                Ticket relacionado
            </label>

            <select class="form-control"
                    th:field="*{ticket}"
                    id="ticket">

                <option value="">
                    Sin ticket relacionado
                </option>

                <option th:each="item : ${tickets}"
                        th:value="${item.id}"
                        th:text="${'Ticket #' + item.id}">
                </option>

            </select>

        </div>


        <!-- TIPO -->

        <div class="form-group mb-3">

            <label for="tipo">
                Tipo de mantenimiento
            </label>

            <select class="form-control"
                    th:field="*{tipo}"
                    id="tipo"
                    required>

                <option th:each="item : ${tipos}"
                        th:value="${item}"
                        th:text="${item}">
                </option>

            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('tipo')}"
                 th:errors="*{tipo}">
            </div>

        </div>


        <!-- DESCRIPCIÓN -->

        <div class="form-group mb-3">

            <label for="descripcion">
                Descripción del mantenimiento
            </label>

            <textarea class="form-control"
                      th:field="*{descripcion}"
                      id="descripcion"
                      rows="4"
                      required>
            </textarea>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('descripcion')}"
                 th:errors="*{descripcion}">
            </div>

        </div>


        <!-- REPUESTOS -->

        <div class="form-group mb-3">

            <label for="repuestos">
                Repuestos utilizados
            </label>

            <textarea class="form-control"
                      th:field="*{repuestos}"
                      id="repuestos"
                      rows="3">
            </textarea>

        </div>


        <!-- FECHA -->

        <div class="form-group mb-3">

            <label for="fecha">
                Fecha del mantenimiento
            </label>

            <input type="datetime-local"
                   class="form-control"
                   th:field="*{fecha}"
                   id="fecha">

        </div>


        <button type="submit"
                class="btn btn-primary">
            Guardar cambios
        </button>

        <a th:href="@{/mantenimientos}"
           class="btn btn-secondary">
            Regresar
        </a>

    </form>

</div>

</html>
