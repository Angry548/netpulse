<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <!-- Mensajes -->
    <div th:if="${msg != null}">
        <script>
            Swal.fire({
                title: "Confirmación",
                text: '[[${msg}]]',
                icon: "success"
            });
        </script>
    </div>

    <div th:if="${error != null}">
        <script>
            Swal.fire({
                title: "Error",
                text: '[[${error}]]',
                icon: "error"
            });
        </script>
    </div>

    <h1>Listado de prioridades de ticket</h1>

    <a th:href="@{/prioridades-ticket/create}"
       class="btn btn-outline-primary">
        Nueva prioridad
    </a>

    <!-- Buscador -->
    <form th:action="@{/prioridades-ticket}"
          method="get"
          class="row g-2 my-3"
          th:hx-get="@{/prioridades-ticket/buscar}"
          hx-target="#tabla-prioridades"
          hx-trigger="input changed delay:300ms"
          hx-swap="outerHTML">

        <div class="col-md-6">
            <label for="nombre" class="visually-hidden">
                Nombre
            </label>

            <input type="text"
                   class="form-control"
                   id="nombre"
                   name="nombre"
                   th:value="${nombre}"
                   placeholder="Buscar por nombre">
        </div>

        <div class="col-auto">
            <button type="submit"
                    class="btn btn-outline-secondary">
                Buscar
            </button>
        </div>

        <div class="col-auto">
            <a th:href="@{/prioridades-ticket}"
               class="btn btn-outline-secondary">
                Limpiar
            </a>
        </div>

    </form>

    <!-- Tabla -->
    <div id="tabla-prioridades"
         th:fragment="tablaPrioridades">

        <table class="table table-striped">

            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="item : ${prioridades}">

                <td th:text="${item.id}"></td>

                <td th:text="${item.nombre}"></td>

                <td>

                    <a th:href="@{/prioridades-ticket/details/{id}(id=${item.id})}"
                       class="btn btn-outline-secondary">
                        Detalles
                    </a>

                    <a th:href="@{/prioridades-ticket/edit/{id}(id=${item.id})}"
                       class="btn btn-outline-info">
                        Editar
                    </a>

                    <a th:href="@{/prioridades-ticket/remove/{id}(id=${item.id})}"
                       class="btn btn-outline-danger">
                        Eliminar
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

        <!-- Paginación -->
        <nav aria-label="Paginación">

            <ul class="pagination">

                <li class="page-item"
                    th:each="pageNumber : ${pageNumbers}">

                    <a class="page-link"
                       th:href="@{|/prioridades-ticket?page=${pageNumber}&nombre=${nombre}|}"
                       th:text="${pageNumber}">
                    </a>

                </li>

            </ul>

        </nav>

    </div>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

</div>

</html>
