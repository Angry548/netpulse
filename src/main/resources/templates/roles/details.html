<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="/layouts/_mainLayout">

<head> <title>Detalles del Rol</title> </head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <!-- ENCABEZADO -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="mb-1">
                    <i class="fa-solid fa-user-shield"></i>
                    Detalles del Rol
                </h2>

                <p class="text-muted mb-0">
                    Información del rol seleccionado.
                </p>
            </div>

        </div>


        <!-- TARJETA -->
        <div class="card shadow-sm">

            <div class="card-header">

                <h5 class="mb-0">
                    Información general
                </h5>

            </div>


            <div class="card-body">

                <div class="row">

                    <!-- ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            ID
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${rol.idRol}"
                               readonly>

                    </div>


                    <!-- NOMBRE -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Nombre
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${rol.nombre}"
                               readonly>

                    </div>


                    <!-- DESCRIPCIÓN -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label fw-bold">
                            Descripción
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  th:text="${rol.descripcion}"
                                  readonly></textarea>

                    </div>

                </div>


                <hr>


                <!-- BOTONES -->
                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/roles/edit/{id}(id=${rol.idRol})}"
                       class="btn btn-warning">

                        <i class="fa-solid fa-pen"></i>
                        Editar

                    </a>

                    <a th:href="@{/roles}"
                       class="btn btn-secondary">

                        Regresar

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body> </html>
