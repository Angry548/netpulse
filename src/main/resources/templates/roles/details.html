<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <h1>Detalles del rol</h1>

    <hr>

    <dl class="row">

        <dt class="col-sm-2">
            ID
        </dt>

        <dd class="col-sm-10"
            th:text="${rol.idRol}">

        </dd>


        <dt class="col-sm-2">
            Nombre
        </dt>

        <dd class="col-sm-10"
            th:text="${rol.nombre}">

        </dd>


        <dt class="col-sm-2">
            Descripción
        </dt>

        <dd class="col-sm-10"
            th:text="${rol.descripcion}">

        </dd>

    </dl>


    <a th:href="@{/roles/edit/{id}(id=${rol.idRol})}"
       class="btn btn-outline-info">

        <i class="fas fa-edit"></i>
        Editar

    </a>

    <a th:href="@{/roles}"
       class="btn btn-secondary">

        Regresar

    </a>

</div>

</html>
