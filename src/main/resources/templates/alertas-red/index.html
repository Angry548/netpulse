<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <!-- MENSAJE DE CONFIRMACIÓN -->
    <div th:if="${msg != null}">
        <script th:inline="javascript">
            Swal.fire({
                title: "Confirmación",
                text: /*[[${msg}]]*/ "",
                icon: "success"
            });
        </script>
    </div>

    <!-- MENSAJE DE ERROR -->
    <div th:if="${error != null}">
        <script th:inline="javascript">
            Swal.fire({
                title: "Error",
                text: /*[[${error}]]*/ "",
                icon: "error"
            });
        </script>
    </div>

    <h1 class="mt-4">
        Listado de alertas de red
    </h1>

    <!-- FILTROS -->
    <form th:action="@{/alertas-red}"
          method="get"
          class="row g-2 my-3">

        <!-- ID -->
        <div class="col-md-2">

            <label for="id"
                   class="visually-hidden">
                ID
            </label>

            <input type="number"
                   class="form-control"
                   id="id"
                   name="id"
                   th:value="${id}"
                   placeholder="Buscar por ID">

        </div>

        <!-- TIPO DE EVENTO -->
        <div class="col-md-6">

            <label for="tipoEvento"
                   class="visually-hidden">
                Tipo de evento
            </label>

            <input type="text"
                   class="form-control"
                   id="tipoEvento"
                   name="tipoEvento"
                   th:value="${tipoEvento}"
                   placeholder="Buscar por tipo de evento">

        </div>

        <!-- BUSCAR -->
        <div class="col-auto">

            <button type="submit"
                    class="btn btn-outline-secondary">

                <i class="fas fa-search"></i>
                Buscar

            </button>

        </div>

        <!-- LIMPIAR -->
        <div class="col-auto">

            <a th:href="@{/alertas-red}"
               class="btn btn-outline-secondary">

                <i class="fas fa-broom"></i>
                Limpiar

            </a>

        </div>

    </form>

    <!-- TABLA -->
    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Equipo</th>
                <th>Tipo de evento</th>
                <th>Mensaje</th>
                <th>Notificación</th>
                <th>Medio</th>
                <th>Fecha</th>
                <th>Acciones</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="item : ${alertasRed}">

                <!-- ID -->
                <td th:text="${item.id}">
                    1
                </td>

                <!-- EQUIPO -->
                <td th:text="${item.equipo != null
                              ? item.equipo.nombre
                              : 'Sin equipo'}">
                    Router principal
                </td>

                <!-- TIPO DE EVENTO -->
                <td th:text="${item.tipoEvento}">
                    Desconexión
                </td>

                <!-- MENSAJE -->
                <td th:text="${item.mensaje}">
                    El equipo perdió conexión.
                </td>

                <!-- NOTIFICACIÓN -->
                <td>

                    <span th:if="${item.notificacionEnviada}"
                          class="badge bg-success">

                        Enviada

                    </span>

                    <span th:unless="${item.notificacionEnviada}"
                          class="badge bg-warning text-dark">

                        Pendiente

                    </span>

                </td>

                <!-- MEDIO -->
                <td th:text="${item.medioNotificacion != null
                              && !item.medioNotificacion.isBlank()
                              ? item.medioNotificacion
                              : 'No definido'}">

                    Correo

                </td>

                <!-- FECHA -->
                <td th:text="${item.fecha != null
                              ? #temporals.format(item.fecha, 'dd/MM/yyyy HH:mm')
                              : 'No registrada'}">

                    01/09/2026 10:30

                </td>

                <!-- ACCIONES -->
                <td>

                    <a th:href="@{/alertas-red/details/{id}(id=${item.id})}"
                       class="btn btn-outline-secondary btn-sm">

                        <i class="fas fa-eye"></i>
                        Detalles

                    </a>

                    <a th:href="@{/alertas-red/remove/{id}(id=${item.id})}"
                       class="btn btn-outline-danger btn-sm">

                        <i class="fas fa-trash"></i>
                        Eliminar

                    </a>

                </td>

            </tr>

            <!-- SIN RESULTADOS -->
            <tr th:if="${alertasRed.empty}">

                <td colspan="8"
                    class="text-center text-muted">

                    No se encontraron alertas de red.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <!-- PAGINACIÓN -->
    <nav th:if="${alertasRed.totalPages > 1}"
         aria-label="Paginación de alertas de red">

        <ul class="pagination">

            <!-- ANTERIOR -->
            <li class="page-item"
                th:classappend="${alertasRed.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/alertas-red(
                       page=${alertasRed.number},
                       size=${alertasRed.size},
                       id=${id},
                       tipoEvento=${tipoEvento}
                   )}">

                    Anterior

                </a>

            </li>

            <!-- NÚMEROS -->
            <li class="page-item"
                th:each="pageNumber : ${pageNumbers}"
                th:classappend="${pageNumber == alertasRed.number + 1} ? 'active'">

                <a class="page-link"
                   th:href="@{/alertas-red(
                       page=${pageNumber},
                       size=${alertasRed.size},
                       id=${id},
                       tipoEvento=${tipoEvento}
                   )}"
                   th:text="${pageNumber}">

                    1

                </a>

            </li>

            <!-- SIGUIENTE -->
            <li class="page-item"
                th:classappend="${alertasRed.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/alertas-red(
                       page=${alertasRed.number + 2},
                       size=${alertasRed.size},
                       id=${id},
                       tipoEvento=${tipoEvento}
                   )}">

                    Siguiente

                </a>

            </li>

        </ul>

    </nav>

</div>

</html>
