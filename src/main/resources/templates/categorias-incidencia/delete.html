<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Eliminar Categoría de Incidencia</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="mb-1 text-danger">

                    <i class="fa-solid fa-tag"></i>
                    Eliminar Categoría de Incidencia

                </h2>

                <p class="text-muted mb-0">
                    Confirma la eliminación de la categoría.
                </p>

            </div>

        </div>

        <div class="card shadow-sm border-danger">

            <div class="card-header bg-danger text-white">

                <h5 class="mb-0">
                    Confirmación
                </h5>

            </div>

            <div class="card-body">

                <div class="alert alert-warning">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <strong>¡Atención!</strong>

                    ¿Está seguro de que desea eliminar esta categoría?

                    Esta acción no se puede deshacer.

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            ID
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${categoria.id}"
                               readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Nombre
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${categoria.nombre}"
                               readonly>

                    </div>

                    <div class="col-md-12 mb-3">

                        <label class="form-label fw-bold">
                            Descripción
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  th:text="${categoria.descripcion != null ? categoria.descripcion : 'Sin descripción'}"
                                  readonly>
                        </textarea>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Estado
                        </label>

                        <div>

                            <span th:if="${categoria.activo}"
                                  class="badge bg-success">

                                Activo

                            </span>

                            <span th:unless="${categoria.activo}"
                                  class="badge bg-danger">

                                Inactivo

                            </span>

                        </div>

                    </div>

                </div>

                <hr>

                <form th:action="@{/categorias-incidencia/delete}"
                      method="post">

                    <input type="hidden"
                           name="id"
                           th:value="${categoria.id}">

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/categorias-incidencia}"
                           class="btn btn-secondary">

                            Cancelar

                        </a>

                        <button type="submit"
                                class="btn btn-danger">

                            <i class="fa-solid fa-trash"></i>

                            Sí, eliminar categoría

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
