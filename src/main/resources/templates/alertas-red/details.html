<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Detalles de la Alerta de Red</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <!-- ENCABEZADO -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="mb-1">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    Detalles de la Alerta de Red

                </h2>

                <p class="text-muted mb-0">

                    Información de la alerta de red seleccionada.

                </p>

            </div>

        </div>

        <!-- TARJETA -->
        <div class="card shadow-sm">

            <div class="card-header">

                <h5 class="mb-0">

                    Información de la alerta

                </h5>

            </div>

            <div class="card-body">

                <div class="row">

                    <!-- ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            ID
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${alerta.id}"
                               readonly>

                    </div>

                    <!-- EQUIPO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Equipo
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${alerta.equipo != null
                                          ? alerta.equipo.nombre
                                          : 'Sin equipo'}"
                               readonly>

                    </div>

                    <!-- TIPO DE EVENTO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Tipo de evento
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${alerta.tipoEvento}"
                               readonly>

                    </div>

                    <!-- MEDIO DE NOTIFICACIÓN -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Medio de notificación
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${alerta.medioNotificacion != null
                                          && !alerta.medioNotificacion.isBlank()
                                          ? alerta.medioNotificacion
                                          : 'No definido'}"
                               readonly>

                    </div>

                    <!-- MENSAJE -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label fw-bold">
                            Mensaje
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  th:text="${alerta.mensaje}"
                                  readonly></textarea>

                    </div>

                    <!-- NOTIFICACIÓN -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Estado de notificación
                        </label>

                        <div>

                            <span th:if="${alerta.notificacionEnviada}"
                                  class="badge bg-success">

                                Notificación enviada

                            </span>

                            <span th:unless="${alerta.notificacionEnviada}"
                                  class="badge bg-warning text-dark">

                                Notificación pendiente

                            </span>

                        </div>

                    </div>

                    <!-- FECHA -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Fecha
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${alerta.fecha != null
                                          ? #temporals.format(alerta.fecha, 'dd/MM/yyyy HH:mm')
                                          : 'No registrada'}"
                               readonly>

                    </div>

                </div>

                <hr>

                <!-- BOTONES -->
                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/alertas-red/remove/{id}(id=${alerta.id})}"
                       class="btn btn-danger">

                        <i class="fa-solid fa-trash"></i>

                        Eliminar

                    </a>

                    <a th:href="@{/alertas-red}"
                       class="btn btn-secondary">

                        Regresar

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
