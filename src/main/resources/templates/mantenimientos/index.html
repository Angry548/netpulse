<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <div th:if="${msg != null}">
        <script>
            Swal.fire({
                title: "Confirmación",
                text: '[[${msg}]]',
                icon: "success"
            });
        </script>
    </div>

    <div th:if="${error != null}">
        <script>
            Swal.fire({
                title: "Error",
                text: '[[${error}]]',
                icon: "error"
            });
        </script>
    </div>

    <h1>Listado de mantenimientos</h1>

    <a th:href="@{/mantenimientos/create}"
       class="btn btn-outline-primary mb-3">
        Nuevo mantenimiento
    </a>

    <table class="table table-striped">

        <thead>
        <tr>
            <th>ID</th>
            <th>Equipo</th>
            <th>Técnico</th>
            <th>Ticket</th>
            <th>Tipo</th>
            <th>Descripción</th>
            <th>Fecha</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="item : ${mantenimientos}">

            <td th:text="${item.id}"></td>

            <td th:text="${item.equipo.nombre}"></td>

            <td th:text="${item.tecnico.nombre}"></td>

            <td>
                <span th:if="${item.ticket != null}"
                      th:text="${item.ticket.id}">
                </span>

                <span th:if="${item.ticket == null}">
                    Sin ticket
                </span>
            </td>

            <td th:text="${item.tipo}"></td>

            <td th:text="${item.descripcion}"></td>

            <td th:text="${item.fecha != null ? #temporals.format(item.fecha, 'dd/MM/yyyy HH:mm') : 'Sin fecha'}"></td>

            <td>

                <a th:href="@{/mantenimientos/details/{id}(id=${item.id})}"
                   class="btn btn-outline-secondary btn-sm">
                    Detalles
                </a>

                <a th:href="@{/mantenimientos/edit/{id}(id=${item.id})}"
                   class="btn btn-outline-info btn-sm">
                    Editar
                </a>

                <a th:href="@{/mantenimientos/remove/{id}(id=${item.id})}"
                   class="btn btn-outline-danger btn-sm">
                    Eliminar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <nav aria-label="Paginación">

        <ul class="pagination">

            <li class="page-item"
                th:each="pageNumber : ${pageNumbers}">

                <a class="page-link"
                   th:href="@{|/mantenimientos?page=${pageNumber}|}"
                   th:text="${pageNumber}">
                </a>

            </li>

        </ul>

    </nav>

</div>

</html>
