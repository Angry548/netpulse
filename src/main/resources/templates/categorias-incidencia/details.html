<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <h1>Detalles de la categoría de incidencia</h1>

    <hr>

    <dl class="row">

        <dt class="col-sm-2">
            ID
        </dt>

        <dd class="col-sm-10"
            th:text="${categoria.id}">
        </dd>

        <dt class="col-sm-2">
            Nombre
        </dt>

        <dd class="col-sm-10"
            th:text="${categoria.nombre}">
        </dd>

        <dt class="col-sm-2">
            Descripción
        </dt>

        <dd class="col-sm-10"
            th:text="${categoria.descripcion}">
        </dd>

        <dt class="col-sm-2">
            Estado
        </dt>

        <dd class="col-sm-10">

            <span th:if="${categoria.activo}"
                  class="badge bg-success">
                Activo
            </span>

            <span th:unless="${categoria.activo}"
                  class="badge bg-danger">
                Inactivo
            </span>

        </dd>

    </dl>

    <a th:href="@{/categorias-incidencia/edit/{id}(id=${categoria.id})}"
       class="btn btn-outline-info">
        Editar
    </a>

    <a th:href="@{/categorias-incidencia}"
       class="btn btn-secondary">
        Regresar
    </a>

</div>

</html>
