<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Crear Ticket</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <!-- ENCABEZADO -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="mb-1">
                    <i class="fa-solid fa-ticket"></i>
                    Crear Ticket
                </h2>

                <p class="text-muted mb-0">
                    Registra un nuevo ticket en el sistema.
                </p>
            </div>

        </div>


        <!-- TARJETA -->
        <div class="card shadow-sm">

            <div class="card-header">

                <h5 class="mb-0">
                    Información del ticket
                </h5>

            </div>


            <div class="card-body">

                <form th:action="@{/tickets/save}"
                      th:object="${ticket}"
                      method="post">

                    <div class="row">

                        <!-- DESCRIPCIÓN -->
                        <div class="col-md-12 mb-3">

                            <label for="descripcion"
                                   class="form-label">

                                Descripción

                            </label>

                            <textarea id="descripcion"
                                      th:field="*{descripcion}"
                                      class="form-control"
                                      rows="4"
                                      maxlength="1000"
                                      required></textarea>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('descripcion')}"
                                 th:errors="*{descripcion}">
                            </div>

                        </div>


                        <!-- EQUIPO -->
                        <div class="col-md-6 mb-3">

                            <label for="idEquipo"
                                   class="form-label">

                                Equipo

                            </label>

                            <select id="idEquipo"
                                    name="idEquipo"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Seleccione un equipo
                                </option>

                                <option th:each="equipo : ${equipos}"
                                        th:value="${equipo.idEquipo}"
                                        th:text="${equipo.nombre}">
                                </option>

                            </select>

                        </div>


                        <!-- USUARIO QUE REPORTA -->
                        <div class="col-md-6 mb-3">

                            <label for="idUsuarioReporta"
                                   class="form-label">

                                Usuario que reporta

                            </label>

                            <select id="idUsuarioReporta"
                                    name="idUsuarioReporta"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Seleccione un usuario
                                </option>

                                <option th:each="usuario : ${usuarios}"
                                        th:value="${usuario.id}"
                                        th:text="${usuario.nombre}">
                                </option>

                            </select>

                        </div>


                        <!-- TÉCNICO -->
                        <div class="col-md-6 mb-3">

                            <label for="idTecnico"
                                   class="form-label">

                                Técnico

                            </label>

                            <select id="idTecnico"
                                    name="idTecnico"
                                    class="form-select">

                                <option value="">
                                    Sin asignar
                                </option>

                                <option th:each="tecnico : ${tecnicos}"
                                        th:value="${tecnico.id}"
                                        th:text="${tecnico.nombre}">
                                </option>

                            </select>

                        </div>


                        <!-- CATEGORÍA -->
                        <div class="col-md-6 mb-3">

                            <label for="idCategoria"
                                   class="form-label">

                                Categoría

                            </label>

                            <select id="idCategoria"
                                    name="idCategoria"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Seleccione una categoría
                                </option>

                                <option th:each="categoria : ${categorias}"
                                        th:value="${categoria.id}"
                                        th:text="${categoria.nombre}">
                                </option>

                            </select>

                        </div>


                        <!-- PRIORIDAD -->
                        <div class="col-md-6 mb-3">

                            <label for="idPrioridad"
                                   class="form-label">

                                Prioridad

                            </label>

                            <select id="idPrioridad"
                                    name="idPrioridad"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Seleccione una prioridad
                                </option>

                                <option th:each="prioridad : ${prioridades}"
                                        th:value="${prioridad.id}"
                                        th:text="${prioridad.nombre}">
                                </option>

                            </select>

                        </div>


                        <!-- ESTADO -->
                        <div class="col-md-6 mb-3">

                            <label for="idEstadoTicket"
                                   class="form-label">

                                Estado

                            </label>

                            <select id="idEstadoTicket"
                                    name="idEstadoTicket"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Seleccione un estado
                                </option>

                                <option th:each="estado : ${estados}"
                                        th:value="${estado.id}"
                                        th:text="${estado.nombre}">
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- ERROR -->
                    <div class="text-danger"
                         th:if="${error}"
                         th:text="${error}">
                    </div>


                    <hr>


                    <!-- BOTONES -->
                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/tickets}"
                           class="btn btn-secondary">

                            Cancelar

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="fa-solid fa-save"></i>

                            Guardar Ticket

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
