<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Eliminar Mantenimiento</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="mb-1 text-danger">
                    <i class="fa-solid fa-trash"></i>
                    Eliminar Mantenimiento
                </h2>

                <p class="text-muted mb-0">
                    Confirma la eliminación del mantenimiento.
                </p>

            </div>

        </div>


        <div class="card shadow-sm border-danger">

            <div class="card-header bg-danger text-white">

                <h5 class="mb-0">
                    Confirmación
                </h5>

            </div>


            <div class="card-body">


                <div class="alert alert-warning">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <strong>¡Atención!</strong>

                    ¿Está seguro de que desea eliminar este mantenimiento?

                    Esta acción no se puede deshacer.

                </div>


                <div class="row">

                    <!-- ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            ID
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.id}"
                               readonly>

                    </div>


                    <!-- EQUIPO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Equipo
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.equipo != null ? mantenimiento.equipo.nombre : 'Sin equipo'}"
                               readonly>

                    </div>


                    <!-- TÉCNICO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Técnico
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.tecnico != null ? mantenimiento.tecnico.nombre : 'Sin técnico'}"
                               readonly>

                    </div>


                    <!-- TICKET -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Ticket
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.ticket != null ? 'Ticket #' + mantenimiento.ticket.id : 'Sin ticket asociado'}"
                               readonly>

                    </div>


                    <!-- TIPO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Tipo de mantenimiento
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.tipo}"
                               readonly>

                    </div>


                    <!-- FECHA -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-bold">
                            Fecha
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${mantenimiento.fecha != null ? #temporals.format(mantenimiento.fecha, 'dd/MM/yyyy HH:mm') : 'No registrada'}"
                               readonly>

                    </div>


                    <!-- DESCRIPCIÓN -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label fw-bold">
                            Descripción
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  readonly
                                  th:text="${mantenimiento.descripcion}">
                        </textarea>

                    </div>

                </div>


                <hr>


                <form th:action="@{/mantenimientos/delete}"
                      method="post">

                    <input type="hidden"
                           name="id"
                           th:value="${mantenimiento.id}">


                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/mantenimientos}"
                           class="btn btn-secondary">

                            Cancelar

                        </a>


                        <button type="submit"
                                class="btn btn-danger">

                            <i class="fa-solid fa-trash"></i>

                            Sí, eliminar mantenimiento

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
