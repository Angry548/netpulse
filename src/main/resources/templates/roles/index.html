<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <!-- Mensaje de éxito -->
    <div th:if="${msg != null}">
        <script th:inline="javascript">
            Swal.fire({
                title: "Confirmación",
                text: /*[[${msg}]]*/ "",
                icon: "success"
            });
        </script>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${error != null}">
        <script th:inline="javascript">
            Swal.fire({
                title: "Error",
                text: /*[[${error}]]*/ "",
                icon: "error"
            });
        </script>
    </div>


    <!-- Título -->
    <h1 class="mt-4">Listado de roles</h1>

    <div class="mb-3">
        <a th:href="@{/roles/create}"
           class="btn btn-outline-primary">

            <i class="fas fa-plus"></i>
            Nuevo rol

        </a>
    </div>


    <!-- =====================================================
         BUSCADOR
         ===================================================== -->

    <form th:action="@{/roles}"
          method="get"
          class="row g-2 my-3">

        <div class="col-md-6">

            <label for="nombre"
                   class="visually-hidden">
                Nombre del rol
            </label>

            <input type="text"
                   class="form-control"
                   id="nombre"
                   name="nombre"
                   th:value="${nombre}"
                   placeholder="Buscar por nombre del rol">

        </div>

        <div class="col-auto">

            <button type="submit"
                    class="btn btn-outline-secondary">

                <i class="fas fa-search"></i>
                Buscar

            </button>

        </div>

        <div class="col-auto">

            <a th:href="@{/roles}"
               class="btn btn-outline-secondary">

                <i class="fas fa-broom"></i>
                Limpiar

            </a>

        </div>

    </form>


    <!-- =====================================================
         TABLA
         ===================================================== -->

    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Nombre</th>

                <th>Descripción</th>

                <th>Acciones</th>

            </tr>

            </thead>


            <tbody>

            <tr th:each="item : ${roles}">

                <td th:text="${item.idRol}">
                    1
                </td>

                <td th:text="${item.nombre}">
                    Administrador
                </td>

                <td th:text="${item.descripcion}">
                    Administrador del sistema
                </td>

                <td>

                    <a th:href="@{/roles/details/{id}(id=${item.idRol})}"
                       class="btn btn-outline-secondary btn-sm">

                        <i class="fas fa-eye"></i>
                        Detalles

                    </a>


                    <a th:href="@{/roles/edit/{id}(id=${item.idRol})}"
                       class="btn btn-outline-info btn-sm">

                        <i class="fas fa-edit"></i>
                        Editar

                    </a>


                    <a th:href="@{/roles/remove/{id}(id=${item.idRol})}"
                       class="btn btn-outline-danger btn-sm">

                        <i class="fas fa-trash"></i>
                        Eliminar

                    </a>

                </td>

            </tr>


            <!-- Cuando no existen resultados -->

            <tr th:if="${roles.empty}">

                <td colspan="4"
                    class="text-center text-muted">

                    No se encontraron roles.

                </td>

            </tr>

            </tbody>

        </table>

    </div>


    <!-- =====================================================
         PAGINACIÓN
         ===================================================== -->

    <nav th:if="${roles.totalPages > 1}"
         aria-label="Paginación de roles">

        <ul class="pagination">

            <li class="page-item"
                th:classappend="${roles.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/roles(
                       page=${roles.number},
                       size=${roles.size},
                       nombre=${nombre}
                   )}">

                    Anterior

                </a>

            </li>


            <li class="page-item"
                th:each="pageNumber : ${pageNumbers}"
                th:classappend="${pageNumber == roles.number + 1} ? 'active'">

                <a class="page-link"
                   th:href="@{/roles(
                       page=${pageNumber},
                       size=${roles.size},
                       nombre=${nombre}
                   )}"
                   th:text="${pageNumber}">

                    1

                </a>

            </li>


            <li class="page-item"
                th:classappend="${roles.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/roles(
                       page=${roles.number + 2},
                       size=${roles.size},
                       nombre=${nombre}
                   )}">

                    Siguiente

                </a>

            </li>

        </ul>

    </nav>

</div>

</html>
