<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Crear Prioridad</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="mb-1">

                    <i class="fa-solid fa-flag"></i>
                    Crear Prioridad de Ticket

                </h2>

                <p class="text-muted mb-0">

                    Registra una nueva prioridad para los tickets.

                </p>

            </div>

        </div>

        <div class="card shadow-sm">

            <div class="card-header">

                <h5 class="mb-0">
                    Información de la prioridad
                </h5>

            </div>

            <div class="card-body">

                <form th:action="@{/prioridades-ticket/save}"
                      th:object="${prioridad}"
                      method="post">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="nombre"
                                   class="form-label">

                                Nombre

                            </label>

                            <input type="text"
                                   id="nombre"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   maxlength="20"
                                   required>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}">
                            </div>

                            <div class="text-danger"
                                 th:if="${error}"
                                 th:text="${error}">
                            </div>

                        </div>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/prioridades-ticket}"
                           class="btn btn-secondary">

                            Cancelar

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="fa-solid fa-save"></i>
                            Guardar Prioridad

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
