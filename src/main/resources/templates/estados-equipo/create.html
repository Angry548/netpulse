<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Crear Estado de Equipo</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="mb-1">

                    <i class="fa-solid fa-circle-check"></i>
                    Crear Estado de Equipo

                </h2>

                <p class="text-muted mb-0">

                    Registra un nuevo estado de equipo en el sistema.

                </p>

            </div>

        </div>

        <div class="card shadow-sm">

            <div class="card-header">

                <h5 class="mb-0">

                    Información del estado de equipo

                </h5>

            </div>

            <div class="card-body">

                <form th:action="@{/estados-equipo/save}"
                      th:object="${estadoEquipo}"
                      method="post">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="nombre"
                                   class="form-label">

                                Nombre

                            </label>

                            <input type="text"
                                   id="nombre"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   maxlength="50"
                                   required>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}">
                            </div>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label for="descripcion"
                                   class="form-label">

                                Descripción

                            </label>

                            <textarea id="descripcion"
                                      th:field="*{descripcion}"
                                      class="form-control"
                                      maxlength="255"
                                      rows="3"></textarea>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('descripcion')}"
                                 th:errors="*{descripcion}">
                            </div>

                        </div>

                    </div>

                    <div class="text-danger mb-3"
                         th:if="${error != null}"
                         th:text="${error}">
                    </div>

                    <hr>

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/estados-equipo}"
                           class="btn btn-secondary">

                            Cancelar

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="fa-solid fa-save"></i>
                            Guardar Estado de Equipo

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
