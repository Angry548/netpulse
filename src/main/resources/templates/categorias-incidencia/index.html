<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <div th:if="${msg != null}">
        <script th:inline="javascript">
            Swal.fire({
                title: "Confirmación",
                text: /*[[${msg}]]*/ "",
                icon: "success"
            });
        </script>
    </div>

    <div th:if="${error != null}">
        <script th:inline="javascript">
            Swal.fire({
                title: "Error",
                text: /*[[${error}]]*/ "",
                icon: "error"
            });
        </script>
    </div>

    <h1 class="mt-4">Listado de categorías de incidencia</h1>

    <div class="mb-3">

        <a th:href="@{/categorias-incidencia/create}"
           class="btn btn-outline-primary">

            <i class="fas fa-plus"></i>
            Nueva categoría

        </a>

    </div>

    <form th:action="@{/categorias-incidencia}"
          method="get"
          class="row g-2 my-3">

        <div class="col-md-2">

            <label for="id"
                   class="visually-hidden">
                ID
            </label>

            <input type="number"
                   class="form-control"
                   id="id"
                   name="id"
                   th:value="${id}"
                   placeholder="Buscar por ID">

        </div>

        <div class="col-md-6">

            <label for="nombre"
                   class="visually-hidden">
                Nombre
            </label>

            <input type="text"
                   class="form-control"
                   id="nombre"
                   name="nombre"
                   th:value="${nombre}"
                   placeholder="Buscar por nombre">

        </div>

        <div class="col-auto">

            <button type="submit"
                    class="btn btn-outline-secondary">

                <i class="fas fa-search"></i>
                Buscar

            </button>

        </div>

        <div class="col-auto">

            <a th:href="@{/categorias-incidencia}"
               class="btn btn-outline-secondary">

                <i class="fas fa-broom"></i>
                Limpiar

            </a>

        </div>

    </form>

    <div class="table-responsive">

        <table class="table table-striped table-hover">

            <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Nombre</th>

                <th>Descripción</th>

                <th>Estado</th>

                <th>Acciones</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="item : ${categorias}">

                <td th:text="${item.id}">
                    1
                </td>

                <td th:text="${item.nombre}">
                    Hardware
                </td>

                <td th:text="${item.descripcion != null ? item.descripcion : 'Sin descripción'}">
                    Problemas relacionados con hardware.
                </td>

                <td>

                    <span th:if="${item.activo}"
                          class="badge bg-success">

                        Activo

                    </span>

                    <span th:unless="${item.activo}"
                          class="badge bg-danger">

                        Inactivo

                    </span>

                </td>

                <td>

                    <a th:href="@{/categorias-incidencia/details/{id}(id=${item.id})}"
                       class="btn btn-outline-secondary btn-sm">

                        <i class="fas fa-eye"></i>
                        Detalles

                    </a>

                    <a th:href="@{/categorias-incidencia/edit/{id}(id=${item.id})}"
                       class="btn btn-outline-info btn-sm">

                        <i class="fas fa-edit"></i>
                        Editar

                    </a>

                    <form th:if="${item.activo}"
                          th:action="@{/categorias-incidencia/desactivar}"
                          method="post"
                          class="d-inline">

                        <input type="hidden"
                               name="id"
                               th:value="${item.id}">

                        <button type="submit"
                                class="btn btn-outline-warning btn-sm">

                            <i class="fas fa-toggle-off"></i>
                            Desactivar

                        </button>

                    </form>

                    <form th:unless="${item.activo}"
                          th:action="@{/categorias-incidencia/activar}"
                          method="post"
                          class="d-inline">

                        <input type="hidden"
                               name="id"
                               th:value="${item.id}">

                        <button type="submit"
                                class="btn btn-outline-success btn-sm">

                            <i class="fas fa-toggle-on"></i>
                            Activar

                        </button>

                    </form>

                    <a th:href="@{/categorias-incidencia/remove/{id}(id=${item.id})}"
                       class="btn btn-outline-danger btn-sm">

                        <i class="fas fa-trash"></i>
                        Eliminar

                    </a>

                </td>

            </tr>

            <tr th:if="${categorias.empty}">

                <td colspan="5"
                    class="text-center text-muted">

                    No se encontraron categorías de incidencia.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <nav th:if="${categorias.totalPages > 1}"
         aria-label="Paginación de categorías">

        <ul class="pagination">

            <li class="page-item"
                th:classappend="${categorias.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/categorias-incidencia(
                       page=${categorias.number},
                       size=${categorias.size},
                       id=${id},
                       nombre=${nombre}
                   )}">

                    Anterior

                </a>

            </li>

            <li class="page-item"
                th:each="pageNumber : ${pageNumbers}"
                th:classappend="${pageNumber == categorias.number + 1} ? 'active'">

                <a class="page-link"
                   th:href="@{/categorias-incidencia(
                       page=${pageNumber},
                       size=${categorias.size},
                       id=${id},
                       nombre=${nombre}
                   )}"
                   th:text="${pageNumber}">

                    1

                </a>

            </li>

            <li class="page-item"
                th:classappend="${categorias.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/categorias-incidencia(
                       page=${categorias.number + 2},
                       size=${categorias.size},
                       id=${id},
                       nombre=${nombre}
                   )}">

                    Siguiente

                </a>

            </li>

        </ul>

    </nav>

</div>

</html>
