<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<div layout:fragment="content">

    <h1>Eliminar rol</h1>

    <h3>
        ¿Está seguro que desea eliminar este registro?
    </h3>

    <hr>

    <dl class="row">

        <dt class="col-sm-2">
            ID
        </dt>

        <dd class="col-sm-10"
            th:text="${rol.idRol}">

        </dd>


        <dt class="col-sm-2">
            Nombre
        </dt>

        <dd class="col-sm-10"
            th:text="${rol.nombre}">

        </dd>


        <dt class="col-sm-2">
            Descripción
        </dt>

        <dd class="col-sm-10"
            th:text="${rol.descripcion}">

        </dd>

    </dl>


    <form th:action="@{/roles/delete}"
          method="post">

        <input type="hidden"
               name="idRol"
               th:value="${rol.idRol}">

        <button type="submit"
                class="btn btn-danger">

            <i class="fas fa-trash"></i>
            Eliminar

        </button>

        <a th:href="@{/roles}"
           class="btn btn-secondary">

            Cancelar

        </a>

    </form>

</div>

</html>
