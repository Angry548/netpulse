<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/_mainLayout">

<head>
    <title>Crear Mantenimiento</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="mb-1">
                    <i class="fa-solid fa-screwdriver-wrench"></i>
                    Crear Mantenimiento
                </h2>

                <p class="text-muted mb-0">
                    Registra un nuevo mantenimiento en el sistema.
                </p>
            </div>

        </div>

        <div class="card shadow-sm">

            <div class="card-header">

                <h5 class="mb-0">
                    Información del mantenimiento
                </h5>

            </div>

            <div class="card-body">

                <form th:action="@{/mantenimientos/save}"
                      th:object="${mantenimiento}"
                      method="post">

                    <div class="row">

                        <!-- EQUIPO -->
                        <div class="col-md-6 mb-3">

                            <label for="idEquipo"
                                   class="form-label">
                                Equipo
                            </label>

                            <select id="idEquipo"
                                    name="idEquipo"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Seleccione un equipo
                                </option>

                                <option th:each="equipo : ${equipos}"
                                        th:value="${equipo.id}"
                                        th:text="${equipo.nombre}">
                                </option>

                            </select>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('equipo')}"
                                 th:errors="*{equipo}">
                            </div>

                        </div>

                        <!-- TÉCNICO -->
                        <div class="col-md-6 mb-3">

                            <label for="idTecnico"
                                   class="form-label">
                                Técnico
                            </label>

                            <select id="idTecnico"
                                    name="idTecnico"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Seleccione un técnico
                                </option>

                                <option th:each="usuario : ${usuarios}"
                                        th:value="${usuario.id}"
                                        th:text="${usuario.nombre + ' - ' + usuario.correo}">
                                </option>

                            </select>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('tecnico')}"
                                 th:errors="*{tecnico}">
                            </div>

                        </div>

                        <!-- TICKET -->
                        <div class="col-md-6 mb-3">

                            <label for="idTicket"
                                   class="form-label">
                                Ticket
                            </label>

                            <select id="idTicket"
                                    name="idTicket"
                                    class="form-select">

                                <option value="">
                                    Sin ticket asociado
                                </option>

                                <option th:each="ticket : ${tickets}"
                                        th:value="${ticket.id}"
                                        th:text="${'Ticket #' + ticket.id}">
                                </option>

                            </select>

                        </div>

                        <!-- TIPO -->
                        <div class="col-md-6 mb-3">

                            <label for="tipo"
                                   class="form-label">
                                Tipo de mantenimiento
                            </label>

                            <select id="tipo"
                                    th:field="*{tipo}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Seleccione un tipo
                                </option>

                                <option th:each="tipoMantenimiento : ${tipos}"
                                        th:value="${tipoMantenimiento}"
                                        th:text="${tipoMantenimiento}">
                                </option>

                            </select>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('tipo')}"
                                 th:errors="*{tipo}">
                            </div>

                        </div>

                        <!-- DESCRIPCIÓN -->
                        <div class="col-md-12 mb-3">

                            <label for="descripcion"
                                   class="form-label">
                                Descripción
                            </label>

                            <textarea id="descripcion"
                                      th:field="*{descripcion}"
                                      class="form-control"
                                      rows="4"
                                      required></textarea>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('descripcion')}"
                                 th:errors="*{descripcion}">
                            </div>

                        </div>

                        <!-- REPUESTOS -->
                        <div class="col-md-12 mb-3">

                            <label for="repuestos"
                                   class="form-label">
                                Repuestos utilizados
                            </label>

                            <textarea id="repuestos"
                                      th:field="*{repuestos}"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Indique los repuestos utilizados, si aplica"></textarea>

                        </div>

                    </div>

                    <div th:if="${error != null}"
                         class="alert alert-danger">

                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span th:text="${error}"></span>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/mantenimientos}"
                           class="btn btn-secondary">

                            Cancelar

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="fa-solid fa-save"></i>
                            Guardar Mantenimiento

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
